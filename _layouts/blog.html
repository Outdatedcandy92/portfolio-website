---
layout: default
---
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
<style>
  .blog-post {
    height: 100vh;
    width: 100vw;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    box-sizing: border-box;
    color: #333333;
  }

  .back-arrow {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 50px;
    color: #333333;
    text-decoration: none;
    font-weight: 900;
    transition: color 0.2s ease;
  }

  .back-arrow:hover {
    color: #0066cc;
  }

  .blog-content {
    max-width: 750px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    /* border: 2px solid #333333; */
    gap: 2rem;
  }

  /* First div - Title */
  .title-section {
    margin-top: 10% ;
    text-align: left;
    width: fit-content;
  }

  .title-row {
    margin-bottom: 0.5rem;
  }

  .title-section h1 {
    font-size: 40px;
    font-weight: 900;
    margin: 0;
    color: #333333;
  }

  .title-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    width: 100%;
    min-width: 200px
  }

  .blog-date {
    font-weight: 500;
    text-transform: lowercase;
  }

  .github-link {
    color: #333333;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
  }

  .github-link:hover {
    color: #0066cc;
    text-decoration: underline;
  }

  /* Second div - Content and Image side by side */
  .content-image-section {
    display: flex;
    gap: 2rem;
    align-items: center;  /* Vertically center content with image */
  }

  .content-left {
    flex: 1;
  }

  .image-right {
    flex: 0.8;  /* Makes it smaller than the content-left (which is flex: 1) */
    /* border: 2px solid #333333; */
    margin-right: 20px;  /* Equal padding/spacing on all sides */
    aspect-ratio: 1 / 1;  /* Makes the div itself square */
  }

  .image-right img {
    width: 100%;
    aspect-ratio: 1 / 1;  /* Makes height equal to width - creates square */
    object-fit: cover;    /* Crops image to fill square without distortion */
    border-radius: 8px;
  }

  /* Third div - Full width image */
  .full-image-section {
    width: 100%;
  }

  .full-image-section img {
    width: 100%;
    height: auto;
    border-radius: 8px;
  }

  /* Content styling */
  .content-left {
    font-size: 18px;
    line-height: 1.35;
    font-weight: 400;
    color: #333333;
  }

  @media (max-width: 768px) {
    .blog-post {
      padding: 20px;
    }

    .content-image-section {
      flex-direction: column;
      gap: 1rem;
    }

    .title-section h1 {
      font-size: 32px;
    }
  }
</style>

<section class="blog-post">
  <div class="blog-content">
    
    <!-- Back arrow positioned at top left -->
    <a href="{{ '/' | relative_url }}" class="back-arrow">&lt;</a>
    
    <!-- First div - Title -->
    <div class="title-section">
      <div class="title-row">
        <h1>{{ page.title }}</h1>
      </div>
      <div class="title-meta">
        <span class="blog-date">{{ page.display_date | default: page.date | date: "%b %Y" }}</span>
        {% if page.github_link %}
          <a href="{{ page.github_link }}" class="github-link" target="_blank">github</a>
        {% endif %}
      </div>
    </div>

    <!-- Second div - Content and Image horizontally -->
    <div class="content-image-section">
      <div class="content-left">
        {{ content }}
      </div>
      <div class="image-right">
        {% if page.image1 %}
          <img src="{{ page.image1 | relative_url }}" alt="Project image">
        {% endif %}
      </div>
    </div>

    <!-- Third div - Full width image -->
    <div class="full-image-section">
      {% if page.image2 %}
        <img src="{{ page.image2 | relative_url }}" alt="Full width project image">
      {% endif %}
    </div>

  </div>
</section>
